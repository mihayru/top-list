name: Collect koyo data & deploy

on:
  schedule:
    # every 2 hours from 05:17 to 23:17 JST (cron is UTC)
    - cron: "17 20,22,0,2,4,6,8,10,12,14 * * *"
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["collector/**", "site/**", "data/places.json", "data/manual/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: koyo-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Parser tests (saved real pages)
        run: python -m pytest -q tests
      - name: Route planner tests
        continue-on-error: true
        run: node --test tests/js/planner.test.js tests/js/planner2.test.js tests/js/transport.test.js
      - name: Collect all sources (each isolated; failures fall back to last snapshot)
        run: python -m collector.run
      - name: Commit data
        run: |
          git config user.name "koyo-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: update $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
      - name: Cache-busting version for static files
        run: sed -i "s/__V__/${GITHUB_SHA::8}-$(date +%s)/g" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    # Requires Settings → Pages → Source: "GitHub Actions" (once).
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
