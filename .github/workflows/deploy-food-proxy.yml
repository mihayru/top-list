name: Deploy food proxy (Cloudflare Worker)

# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GOOGLE_MAPS_KEY  (ANTHROPIC_API_KEY optional)
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["worker/**", ".github/workflows/deploy-food-proxy.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: food-proxy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check secrets are present (values are never printed)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GKEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$GKEY" ] && missing="$missing GOOGLE_MAPS_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi
          echo "All required secrets are set."
      - name: Install and test
        working-directory: worker
        run: npm install --no-audit --no-fund && npm test
      - name: Deploy worker and upload secrets
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          printf '%s' "$GOOGLE_MAPS_KEY" | npx wrangler secret put GOOGLE_MAPS_KEY
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY; fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Deployed, but no workers.dev URL found. In Cloudflare → Workers & Pages, open the Workers overview once to register a workers.dev subdomain, then re-run this workflow."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -s -H "Origin: https://mihayru.github.io" "${{ steps.deploy.outputs.url }}/health" || true)
            echo "$body" | grep -q '"places":true' && { echo "Proxy healthy: $body"; exit 0; }
            sleep 10
          done
          echo "::error::Proxy did not report places:true — last answer: $body"; exit 1
      - name: Point the site at the proxy and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ steps.deploy.outputs.url }}"
          printf '/* Address of the secure «Где поесть» proxy (Cloudflare Worker). Not a secret — keys live on the proxy.\n   Written automatically by deploy-food-proxy.yml. */\nwindow.KOYO_FOOD_API = "%s";\n' "$url" > site/food-config.js
          git config user.name "koyo-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/food-config.js
          if ! git diff --cached --quiet; then
            git commit -m "food: proxy at $url"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
          fi
          gh workflow run update.yml --ref "${GITHUB_REF_NAME}"
          echo "### Food proxy deployed: $url" >> "$GITHUB_STEP_SUMMARY"
